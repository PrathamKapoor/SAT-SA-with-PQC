[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsmlops"
version = "0.1.0"
description = "Quantum-Secure Agentic MLOps Pipeline Management System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "kyber-py>=1.2.0",
    "dilithium-py>=1.4.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "cryptography>=42.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "starlette>=0.36",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "click>=8.1",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
    "python-pkcs11>=0.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
qsmlops = "qsmlops.cli:cli"
sat-sa = "satsa.cli:main"

[tool.setuptools.packages.find]
include = ["qsmlops*", "satsa*", "evaluation*", "public_benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["satsa", "evaluation"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
precision = 1
skip_covered = false

[tool.mypy]
ignore_missing_imports = true
# Gradually-typed codebase (see CHANGELOG.md / docs/roadmap-status.md
# P26 addendum, checklist item 10): not run as a CI gate yet. Existing
# type errors are in pre-P26 modules (satsa/analysis/run.py, trust.py,
# workers/anomaly.py, workers/peer_benchmark.py,
# domain/workflow.py — see the measured baseline in
# docs/roadmap-status.md). Every module added in phase P26
# (satsa/analysis/calibration.py, correlation.py, satsa/security.py,
# evaluation/baselines/, evaluation/ablation/) is mypy-clean on its
# own — verified, not assumed.
