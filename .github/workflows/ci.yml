name: CI

# Runs the full SAT-SA verification suite on GitHub's hosted runners.
#
# Package installation here needs network access to PyPI — that is a
# CI/build-time requirement, not a claim about SAT-SA's own runtime.
# SAT-SA's air-gapped guarantee is about the deployed application
# making zero network calls once installed (proven by
# tests/test_phase18_satsa_offline_hardening.py, which this workflow
# runs), the same distinction the project already draws for local
# `pip install` during deployment (docs/deployment.md).
#
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # requirements.txt supplies runtime/test dependencies; this step
          # installs the project console scripts (including `sat-sa`).
          pip install -e . --no-deps

      - name: Byte-compile the whole tree (import/syntax integrity)
        run: python -m compileall -q satsa qsmlops scripts tests

      - name: Full test suite
        run: python -m pytest tests/ -q

      - name: Offline-hardening guarantee (explicit, not just bundled in the suite above)
        run: python -m pytest tests/test_phase18_satsa_offline_hardening.py -q -v

      - name: Deterministic trust behavior (explicit)
        run: |
          python -m pytest tests/test_phase44_satsa_trust_stress.py -q -v
          python -m pytest tests/test_phase66_satsa_tamper_matrix.py -q -v

      - name: Authentication / RBAC adversarial suite (explicit)
        run: python -m pytest tests/test_phase63_satsa_auth_rbac.py -q -v

      - name: CLI smoke test
        run: |
          sat-sa --version
          sat-sa --db ./ci-smoke.db --trust-key-dir ./ci-smoke-keys agents
          sat-sa --db ./ci-smoke.db --trust-key-dir ./ci-smoke-keys demo
          sat-sa --db ./ci-smoke.db --trust-key-dir ./ci-smoke-keys validate

      - name: Demo (SAT-SA-first entry point)
        run: python demo.py --db ./ci-demo.db --keys ./ci-demo-keys

  package-integrity:
    name: package + import integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install in editable mode and import every public module
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -c "import satsa, qsmlops; import satsa.cli, satsa.ui, satsa.service; print('import ok:', satsa.__version__)"

  web:
    name: web UI (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint, typecheck and production build
        run: npm run check

  web-e2e:
    name: web end-to-end (browser, real API + worker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the SAT-SA backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies and browser
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build the web UI
        working-directory: web
        run: npm run build
      - name: Browser workflow against a real backend (SQLite, separate worker)
        working-directory: web
        env:
          SATSA_PYTHON: python
        run: npm run test:e2e
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-results
          path: web/test-results
          if-no-files-found: ignore

  production-stack:
    name: production stack (HTTPS, web, API, worker, PostgreSQL, S3) + browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE: docker compose -f deploy/compose.production.yml -f deploy/compose.objectstore.yml --env-file deploy/production.env
    steps:
      - uses: actions/checkout@v4
      - name: Production settings (throwaway secrets for this run)
        run: |
          umask 077
          {
            echo "SATSA_SITE_ADDRESS=localhost"
            echo "SATSA_POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "SATSA_S3_ENDPOINT_URL=https://s3.satsa.internal:9443"
            echo "SATSA_S3_REGION=us-east-1"
            echo "SATSA_S3_BUCKET=satsa-evidence"
            echo "SATSA_S3_ACCESS_KEY=ci$(openssl rand -hex 12)"
            echo "SATSA_S3_SECRET_KEY=$(openssl rand -hex 32)"
          } > deploy/production.env
      - name: Validate the compose topology
        run: $COMPOSE config --quiet
      - name: Build and start (SATSA_ENVIRONMENT=production)
        run: $COMPOSE up -d --build
      - name: Wait for the public HTTPS site and the API
        run: |
          for attempt in $(seq 1 90); do
            if curl -skf https://localhost/login >/dev/null && $COMPOSE exec -T api python -m satsa.api.healthcheck --role api; then exit 0; fi
            sleep 4
          done
          $COMPOSE ps
          exit 1
      - name: Bootstrap an organization and provision members through the API
        run: |
          set -euo pipefail
          PW=$(grep '^SATSA_POSTGRES_PASSWORD=' deploy/production.env | cut -d= -f2)
          $COMPOSE exec -T api python scripts/bootstrap_satsa_admin.py \
            --database-url "postgresql://satsa:${PW}@database:5432/satsa" \
            --ledger /data/identity-audit-ledger.jsonl \
            --name "CI administrator" --email ci-admin@example.test \
            --organization "CI organization" > bootstrap.txt
          ORG=$(grep '^organization_id=' bootstrap.txt | cut -d= -f2)
          ADMIN=$(tail -n 1 bootstrap.txt)
          echo "::add-mask::${ADMIN}"
          MEMBERS=$($COMPOSE exec -T api python scripts/provision_members.py --api http://api:8000 \
            --credential "$ADMIN" --organization "$ORG" \
            --member analyst "CI analyst" ci-analyst@example.test \
            --member supervisor "CI supervisor" ci-supervisor@example.test \
            --member auditor "CI auditor" ci-auditor@example.test)
          python3 - "$ORG" "$ADMIN" "$MEMBERS" <<'EOF'
          import json, sys
          org, admin, members = sys.argv[1], sys.argv[2], json.loads(sys.argv[3])
          creds = {"organization_id": org, "admin": admin, **members}
          for value in creds.values():
              print(f"::add-mask::{value}")
          open("credentials.json", "w").write(json.dumps(creds))
          EOF
          chmod 600 credentials.json
      - name: Deployment smoke (HTTPS entry point, readiness, full workflow on the worker)
        env:
          SMOKE_INSECURE_TLS: "1"
          SATSA_PUBLIC_URL: https://localhost
        run: |
          set -euo pipefail
          export SATSA_SMOKE_ORGANIZATION_ID=$(python3 -c "import json;print(json.load(open('credentials.json'))['organization_id'])")
          export SATSA_SMOKE_ANALYST_CREDENTIAL=$(python3 -c "import json;print(json.load(open('credentials.json'))['analyst'])")
          export SATSA_SMOKE_SUPERVISOR_CREDENTIAL=$(python3 -c "import json;print(json.load(open('credentials.json'))['supervisor'])")
          export SATSA_SMOKE_AUDITOR_CREDENTIAL=$(python3 -c "import json;print(json.load(open('credentials.json'))['auditor'])")
          COMPOSE="$COMPOSE" bash deploy/smoke.sh
      - name: Worker restart recovery (queued work survives a stopped worker)
        run: |
          set -euo pipefail
          export SATSA_SMOKE_ORGANIZATION_ID=$(python3 -c "import json;print(json.load(open('credentials.json'))['organization_id'])")
          export SATSA_SMOKE_ANALYST_CREDENTIAL=$(python3 -c "import json;print(json.load(open('credentials.json'))['analyst'])")
          export SATSA_SMOKE_SUPERVISOR_CREDENTIAL=$(python3 -c "import json;print(json.load(open('credentials.json'))['supervisor'])")
          export SATSA_SMOKE_AUDITOR_CREDENTIAL=$(python3 -c "import json;print(json.load(open('credentials.json'))['auditor'])")
          $COMPOSE stop worker
          $COMPOSE exec -T -e SATSA_SMOKE_API_URL=http://api:8000 -e SATSA_SMOKE_ORGANIZATION_ID \
            -e SATSA_SMOKE_ANALYST_CREDENTIAL -e SATSA_SMOKE_SUPERVISOR_CREDENTIAL -e SATSA_SMOKE_AUDITOR_CREDENTIAL \
            -e SATSA_SMOKE_TIMEOUT_SECONDS=600 api python scripts/deployment_smoke.py --report /tmp/recovery.json &
          SMOKE=$!
          sleep 25
          if ! kill -0 "$SMOKE" 2>/dev/null; then echo "smoke finished without a worker" >&2; exit 1; fi
          echo "run is waiting with the worker stopped; starting the worker"
          $COMPOSE start worker
          wait "$SMOKE"
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Browser end-to-end through HTTPS against the production stack
        working-directory: web
        env:
          SATSA_E2E_BASE_URL: https://localhost
          SATSA_E2E_CREDENTIALS: ${{ github.workspace }}/credentials.json
          SATSA_E2E_IGNORE_HTTPS_ERRORS: "true"
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: API restart keeps sessions and serves the site
        run: |
          $COMPOSE restart api
          for attempt in $(seq 1 60); do
            if $COMPOSE exec -T api python -m satsa.api.healthcheck --role api && curl -skf https://localhost/login >/dev/null; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: HTTP security smoke (headers, CSP, cache, exposure, traversal, limits, leakage)
        run: python3 deploy/http_security_check.py https://localhost --insecure
      - name: Only the reverse proxy publishes ports
        run: |
          docker ps --filter label=com.docker.compose.project=satsa --format '{{.Label "com.docker.compose.service"}} {{.Ports}}' | tee ports.txt
          python3 - <<'EOF'
          import re
          published = {}
          for line in open("ports.txt"):
              service, _, ports = line.strip().partition(" ")
              published[service] = set(re.findall(r":(\d+)->", ports))
          exposed = {s: p for s, p in published.items() if p}
          assert set(exposed) == {"caddy"}, exposed
          assert exposed["caddy"] <= {"80", "443"}, exposed
          print("published:", exposed)
          EOF
          for port in 8000 3000 5432 8333 9443; do
            if curl -sk --max-time 3 "http://127.0.0.1:${port}/" >/dev/null 2>&1 || curl -sk --max-time 3 "https://127.0.0.1:${port}/" >/dev/null 2>&1; then
              echo "port ${port} answers on the host" >&2; exit 1
            fi
          done
      - name: Login limit holds through the proxy with forged X-Forwarded-For
        working-directory: web
        env:
          SATSA_E2E_BASE_URL: https://localhost
          SATSA_E2E_CREDENTIALS: ${{ github.workspace }}/credentials.json
          SATSA_E2E_IGNORE_HTTPS_ERRORS: "true"
          SATSA_E2E_SUITE: security
        run: npm run test:e2e
      - name: No credential, session token or secret in service logs
        run: |
          set -euo pipefail
          $COMPOSE logs --no-color > all-services.log 2>&1
          python3 - <<'EOF'
          import json, re
          logs = open("all-services.log", encoding="utf-8", errors="replace").read()
          secrets = dict(json.load(open("credentials.json")))
          secrets.pop("organization_id")
          for line in open("deploy/production.env"):
              key, _, value = line.strip().partition("=")
              if key in {"SATSA_POSTGRES_PASSWORD", "SATSA_S3_SECRET_KEY"} and value:
                  secrets[key] = value
          leaked = []
          for name, value in secrets.items():
              # A credential is key_id.secret; the key id alone is not secret.
              for part in ([value.split(".", 1)[1]] if "." in value else [value]):
                  if len(part) >= 16 and part in logs:
                      leaked.append(name)
          # Session tokens: any satsa_session / satsa_api_session cookie value.
          if re.search(r"satsa(_api)?_session=[A-Za-z0-9_-]{16,}", logs):
              leaked.append("session cookie")
          if re.search(r"(?i)authorization: *bearer +[A-Za-z0-9_.-]{16,}", logs):
              leaked.append("bearer header")
          assert not leaked, f"secrets found in service logs: {sorted(set(leaked))}"
          print(f"checked {len(logs)} bytes of logs for {len(secrets)} secrets: none found")
          EOF
      - name: Backup, destroy every volume, restore; recorded TRUST-SAT state still verifies
        run: |
          set -euo pipefail
          ORG=$(python3 -c "import json;print(json.load(open('credentials.json'))['organization_id'])")
          AUDITOR=$(python3 -c "import json;print(json.load(open('credentials.json'))['auditor'])")
          check() {
            $COMPOSE exec -T api python scripts/verify_restored_state.py "$1" --api http://api:8000 \
              --credential "$AUDITOR" --organization "$ORG"
          }
          check record > before.json
          cat before.json
          COMPOSE="$COMPOSE" bash deploy/backup.sh "$RUNNER_TEMP/backups"
          $COMPOSE down -v
          COMPOSE="$COMPOSE" bash deploy/restore.sh "$(ls -d "$RUNNER_TEMP"/backups/satsa-* | tail -n 1)"
          $COMPOSE up -d
          for attempt in $(seq 1 90); do
            if curl -skf https://localhost/login >/dev/null && $COMPOSE exec -T api python -m satsa.api.healthcheck --role api; then break; fi
            sleep 4
          done
          check compare < before.json
          # The restored signing key is the one in use: no new key was generated.
          $COMPOSE logs key-init | tee key-init.log
      - name: Service logs and health diagnostics
        if: always()
        run: |
          $COMPOSE ps -a > production-stack.log 2>&1 || true
          for s in api worker web caddy; do
            echo "== health: $s" >> production-stack.log
            docker inspect --format '{{json .State.Health}}' "satsa-$s-1" >> production-stack.log 2>&1 || true
          done
          $COMPOSE logs --no-color --tail 200 >> production-stack.log 2>&1 || true
      - name: Upload logs and Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-stack-results
          path: |
            production-stack.log
            web/test-results
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: $COMPOSE down -v

  docker-build-smoke:
    name: Docker build/smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --pull --tag trust-sat:ci .
      - name: Run SAT-SA CLI smoke
        run: >-
          docker run --rm --entrypoint sat-sa trust-sat:ci
          --db /tmp/satsa.db --trust-key-dir /tmp/satsa-keys doctor

  image-scan:
    name: container image scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned scanner image (digest), run as a container rather than a
      # third-party action.
      TRIVY: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: actions/checkout@v4
      - name: Build the SAT-SA images
        run: |
          docker build --pull --tag satsa-backend:scan .
          docker build --pull --tag satsa-web:scan web
      - name: Pull the supporting images used by deploy/
        run: |
          for image in postgres:17-alpine caddy:2 chrislusf/seaweedfs:4.47 alpine:3; do docker pull -q "$image"; done
      - name: Scan (SAT-SA images fail on fixable CRITICAL; all images report HIGH and CRITICAL)
        run: |
          set -uo pipefail
          scan() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              "$TRIVY" image --scanners vuln --no-progress "$@"
          }
          status=0
          for image in satsa-backend:scan satsa-web:scan; do
            echo "::group::$image (policy: no fixable CRITICAL)"
            scan --severity HIGH,CRITICAL "$image" | tee -a image-scan.txt
            scan --severity CRITICAL --ignore-unfixed --exit-code 1 --format table "$image" > /dev/null || status=1
            echo "::endgroup::"
          done
          for image in postgres:17-alpine caddy:2 chrislusf/seaweedfs:4.47 alpine:3; do
            echo "::group::$image (report only: upstream image, upgraded by tag)"
            scan --severity HIGH,CRITICAL "$image" | tee -a image-scan.txt
            echo "::endgroup::"
          done
          exit $status
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-scan-report
          path: image-scan.txt
          if-no-files-found: ignore

  dependency-audit:
    name: dependency audit and static analysis (npm audit, pip-audit, Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - name: npm audit (production dependencies, high and critical)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: pip-audit (pinned runtime requirements)
        run: |
          python -m pip install --quiet pip-audit
          pip-audit --requirement requirements.txt --progress-spinner off
      - name: Bandit (application and deployment code; fails on HIGH severity)
        run: |
          python -m pip install --quiet bandit
          bandit -r satsa scripts deploy --severity-level high --quiet

  saas-topology-smoke:
    name: SaaS topology smoke (PostgreSQL + SeaweedFS + API + worker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f docker-compose.saas.yml
      SATSA_POSTGRES_PASSWORD: ci-postgres-${{ github.run_id }}
      SATSA_S3_ACCESS_KEY: ci-access-${{ github.run_id }}
      SATSA_S3_SECRET_KEY: ci-secret-${{ github.run_id }}-${{ github.run_attempt }}
      SATSA_S3_BUCKET: satsa-private
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and start the compose topology
        run: $COMPOSE up -d --build
      - name: Wait for API readiness (migration, key init, storage, database)
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health/ready; then exit 0; fi
            sleep 5
          done
          echo "API never became ready" >&2
          exit 1
      - name: Bootstrap a smoke organization and administrator
        run: |
          $COMPOSE run --rm --no-deps api python scripts/bootstrap_satsa_admin.py \
            --database-url "postgresql://satsa:${SATSA_POSTGRES_PASSWORD}@database:5432/satsa" \
            --ledger /data/identity-audit-ledger.jsonl \
            --name "CI smoke admin" --email ci-admin@example.test \
            --organization "CI smoke organization" > bootstrap.txt
          echo "SATSA_SMOKE_ORGANIZATION_ID=$(grep '^organization_id=' bootstrap.txt | cut -d= -f2)" >> "$GITHUB_ENV"
          credential="$(tail -n 1 bootstrap.txt)"
          echo "::add-mask::${credential}"
          echo "SATSA_SMOKE_ADMIN_CREDENTIAL=${credential}" >> "$GITHUB_ENV"
      - name: HTTP smoke through API, worker, PostgreSQL and SeaweedFS
        env:
          SATSA_SMOKE_API_URL: http://127.0.0.1:8000
          SATSA_SMOKE_TIMEOUT_SECONDS: "600"
        run: python scripts/deployment_smoke.py --provision --report smoke-report.json
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saas-topology-smoke-report
          path: smoke-report.json
          if-no-files-found: ignore
      - name: Service logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 300
      - name: Tear down
        if: always()
        run: $COMPOSE down -v
