services:
  # Public presentation environment using committed synthetic demo data only.
  # This is not the air-gapped NCIIPC deployment configuration.
  - type: web
    name: SAT-SA-with-PQC
    runtime: docker
    region: singapore
    plan: free
    branch: main
    # Was `checksPass`: GitHub's classic combined-status API reports
    # pending/0 for this repo's commits even when all 4 GitHub Actions
    # checks (test py3.11/3.13, package integrity, Docker build/smoke)
    # succeed, because Actions reports check-runs, not classic statuses.
    # That left Render waiting on a signal that never arrives, so pushes
    # were never auto-deployed. Deploy on every push to `branch` instead.
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render supplies PORT at runtime. Demo state intentionally lives under
    # /tmp, so it resets safely when the instance restarts or redeploys.
    #
    # This runs scripts/render_start.sh rather than an inline `sh -c '...'`
    # string: Render does not hand `dockerCommand` to a real shell before
    # exec'ing it, so a `${PORT:-10000}` expansion written inline here is
    # never expanded — the whole string is looked up as one literal command
    # name and fails with "not found". A committed script with a shebang
    # sidesteps that entirely.
    dockerCommand: scripts/render_start.sh
    healthCheckPath: /
    numInstances: 1
