services:
  # Public presentation environment: the Next.js SAT-SA Workbench frontend
  # (light/purple UI, interactive evidence hero), not the Python backend
  # in this repo. That frontend's source lives on the `feat/sat-sa-site`
  # branch of this same GitHub repo (a separate Next.js codebase with its
  # own Dockerfile at its root) — this service builds and runs that branch.
  #
  # The Python backend's own demo UI (satsa/ui/*, dark/green) previously
  # ran here; scripts/render_start.sh and the render-deploy notes below it
  # are for that path and are unused while `branch: feat/sat-sa-site`.
  - type: web
    name: SAT-SA-with-PQC
    runtime: docker
    region: singapore
    plan: free
    branch: feat/sat-sa-site
    # Was `checksPass`: GitHub's classic combined-status API reports
    # pending/0 for this repo's commits even when all 4 GitHub Actions
    # checks (test py3.11/3.13, package integrity, Docker build/smoke)
    # succeed, because Actions reports check-runs, not classic statuses.
    # That left Render waiting on a signal that never arrives, so pushes
    # were never auto-deployed. Deploy on every push to `branch` instead.
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # No dockerCommand override: the Next.js Dockerfile's own CMD
    # (`node server.js`, a standalone-mode production server) already
    # reads Render's injected $PORT correctly.
    healthCheckPath: /
    numInstances: 1
