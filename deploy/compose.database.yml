# Self-hosted PostgreSQL 17 on the same host (CI and single-host installs).
# AWS deployments use RDS instead (deploy/aws/compose.aws.yml).
#   docker compose -f deploy/compose.production.yml -f deploy/compose.database.yml
#     --env-file deploy/production.env up -d --build
# Requires SATSA_POSTGRES_PASSWORD (URL-safe characters) in the env file.

x-bundled-database-url: &bundled_database_url
  SATSA_DATABASE_URL: postgresql://satsa:${SATSA_POSTGRES_PASSWORD:?set SATSA_POSTGRES_PASSWORD}@database:5432/satsa

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: satsa
      POSTGRES_USER: satsa
      POSTGRES_PASSWORD: ${SATSA_POSTGRES_PASSWORD:?set SATSA_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satsa -d satsa"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    environment: *bundled_database_url
    depends_on:
      database:
        condition: service_healthy

  key-init:
    environment: *bundled_database_url

  api:
    environment: *bundled_database_url

  worker:
    environment: *bundled_database_url

volumes:
  postgres_data:
