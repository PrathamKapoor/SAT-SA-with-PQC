# Local production-like topology. SeaweedFS is single-node development storage;
# hosted deployments must supply independently managed PostgreSQL and S3 storage.
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: satsa
      POSTGRES_USER: satsa
      POSTGRES_PASSWORD: ${SATSA_POSTGRES_PASSWORD:?set a URL-safe random database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satsa -d satsa"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  objectstore:
    image: chrislusf/seaweedfs:4.47
    environment:
      AWS_ACCESS_KEY_ID: ${SATSA_S3_ACCESS_KEY:?set an object storage access key}
      AWS_SECRET_ACCESS_KEY: ${SATSA_S3_SECRET_KEY:?set an object storage secret}
      S3_BUCKET: ${SATSA_S3_BUCKET:-satsa-private}
    volumes:
      - object_data:/data
    restart: unless-stopped

  migrate:
    build: .
    command: ["python", "-m", "satsa.api.migrate", "upgrade"]
    environment: &satsa_environment
      SATSA_ENVIRONMENT: development
      SATSA_DATABASE_URL: postgresql://satsa:${SATSA_POSTGRES_PASSWORD}@database:5432/satsa
      SATSA_DATA_DIR: /data
      SATSA_LEDGER_PATH: /data/evidence-ledger.jsonl
      SATSA_TRUST_KEY_DIR: /data/keys
      SATSA_STORAGE_BACKEND: s3
      SATSA_S3_BUCKET: ${SATSA_S3_BUCKET:-satsa-private}
      SATSA_S3_ENDPOINT_URL: http://objectstore:8333
      SATSA_S3_REGION: us-east-1
      SATSA_S3_USE_SSL: "false"
      SATSA_S3_ADDRESSING_STYLE: path
      SATSA_S3_ACCESS_KEY: ${SATSA_S3_ACCESS_KEY:?set an object storage access key}
      SATSA_S3_SECRET_KEY: ${SATSA_S3_SECRET_KEY:?set an object storage secret}
      SATSA_AUTO_MIGRATE: "false"
    volumes:
      - satsa_durable_data:/data
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  key-init:
    build: .
    command: ["python", "scripts/initialize_trust_key.py"]
    environment: *satsa_environment
    volumes:
      - satsa_durable_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: .
    command: ["python", "-m", "satsa.api.server"]
    environment:
      <<: *satsa_environment
      SATSA_API_HOST: 0.0.0.0
      SATSA_API_PORT: "8000"
      SATSA_COOKIE_SECURE: "false"
      SATSA_ALLOWED_HOSTS: ${SATSA_ALLOWED_HOSTS:-localhost,127.0.0.1}
      SATSA_ALLOWED_ORIGINS: ${SATSA_ALLOWED_ORIGINS:-}
      SATSA_TRUST_PROXY_HEADERS: "false"
    volumes:
      - satsa_durable_data:/data
    ports:
      - "127.0.0.1:${SATSA_API_PORT_PUBLIC:-8000}:8000"
    depends_on:
      key-init:
        condition: service_completed_successfully
      objectstore:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-m", "satsa.api.healthcheck", "--role", "api"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    build: .
    command: ["sat-sa-worker"]
    environment: *satsa_environment
    volumes:
      - satsa_durable_data:/data
    depends_on:
      key-init:
        condition: service_completed_successfully
      objectstore:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-m", "satsa.api.healthcheck", "--role", "worker"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    stop_grace_period: 2m
    restart: unless-stopped

volumes:
  postgres_data:
  object_data:
  satsa_durable_data:
